name: Windows OpenCPN 5.14 port

on:
  workflow_dispatch:
  push:
    branches:
      - opencpn-5.14-windows
  pull_request:
    branches:
      - master

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      WX_VERSION: 3.2.6
      WXWIN: ${{ github.workspace }}\cache\wxWidgets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch legacy Windows build metadata for probe
        shell: pwsh
        run: |
          $path = 'cmake/PluginSetup.cmake'
          $text = Get-Content $path -Raw
          $text = $text.Replace('set(PKG_TARGET "msvc")', 'set(PKG_TARGET "msvc-wx32")')
          $text = $text -replace 'else\(NOT WIN32 AND NOT QT_ANDROID\)\s+set\(ARCH "x86_64"\)', "else(NOT WIN32 AND NOT QT_ANDROID)`n    set(ARCH `"x86`")"
          Set-Content -Path $path -Value $text -Encoding utf8

      - name: Install gettext tools
        shell: pwsh
        run: |
          choco install gettext -y --no-progress
          $gettextBin = 'C:\Program Files\gettext-iconv\bin'
          $env:PATH = "$gettextBin;$env:PATH"
          $gettextBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Get-Command msgfmt
          Get-Command msgmerge

      - name: Download wxWidgets 3.2.6 Win32
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:WXWIN" | Out-Null
          $base = "https://github.com/wxWidgets/wxWidgets/releases/download/v$env:WX_VERSION"
          Invoke-WebRequest "$base/wxWidgets-$env:WX_VERSION-headers.7z" -OutFile wx-headers.7z
          Invoke-WebRequest "$base/wxMSW-$env:WX_VERSION`_vc14x_Dev.7z" -OutFile wx-dev.7z
          Invoke-WebRequest "$base/wxMSW-$env:WX_VERSION`_vc14x_ReleaseDLL.7z" -OutFile wx-dll.7z
          7z x -y wx-headers.7z "-o$env:WXWIN"
          7z x -y wx-dev.7z "-o$env:WXWIN"
          7z x -y wx-dll.7z "-o$env:WXWIN"
          Get-ChildItem "$env:WXWIN\lib"

      - name: Configure VS2022 Win32
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 `
            -DwxWidgets_ROOT_DIR="$env:WXWIN" `
            -DwxWidgets_LIB_DIR="$env:WXWIN\lib\vc14x_dll" `
            -DwxWidgets_CONFIGURATION=mswu `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin DLL
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Inspect DLL with VS2022 dumpbin
        shell: pwsh
        run: |
          $dll = Get-ChildItem build -Recurse -Filter '*twocan*.dll' | Select-Object -First 1
          if (-not $dll) { throw 'TwoCan DLL was not produced' }
          Write-Host "Built: $($dll.FullName)"

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            Write-Warning "vswhere.exe not found; DLL build succeeded, skipping dumpbin inspection."
            exit 0
          }

          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) {
            Write-Warning "Visual Studio C++ tools not found by vswhere; DLL build succeeded, skipping dumpbin inspection."
            exit 0
          }

          $dumpbin = Get-ChildItem "$vsInstall\VC\Tools\MSVC\*\bin\Hostx64\x86\dumpbin.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $dumpbin) {
            $dumpbin = Get-ChildItem "$vsInstall\VC\Tools\MSVC\*\bin\Hostx86\x86\dumpbin.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }

          if (-not $dumpbin) {
            Write-Warning "dumpbin.exe not found; DLL build succeeded, skipping PE inspection."
            exit 0
          }

          Write-Host "Using dumpbin: $($dumpbin.FullName)"
          & $dumpbin.FullName /headers $dll.FullName | Select-String 'machine'
          & $dumpbin.FullName /dependents $dll.FullName

      - name: Generate OpenCPN msvc-wx32 tarball
        shell: pwsh
        run: |
          Push-Location build
          try {
            cpack -G TGZ -C Release --config CPackConfig.cmake
          }
          finally {
            Pop-Location
          }

          $package = Get-ChildItem build -File -Filter '*.tar.gz' |
            Where-Object { $_.Name -match 'msvc-wx32' -and $_.Name -match 'x86' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $package) {
            throw 'OpenCPN msvc-wx32 x86 tarball was not produced'
          }

          Write-Host "OpenCPN package: $($package.FullName)"
          Write-Host 'Tarball contents:'
          $entries = & tar -tzf $package.FullName
          $entries | ForEach-Object { Write-Host $_ }

          $hasPlugin = $entries | Where-Object { $_ -match '(^|/)plugins[/\\]twocan_plugin_pi\.dll$' }
          if (-not $hasPlugin) {
            throw 'Tarball does not contain plugins/twocan_plugin_pi.dll'
          }

          "OPENCPN_TARBALL=$($package.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload OpenCPN import tarball
        uses: actions/upload-artifact@v4
        with:
          name: twocan-opencpn514-msvc-wx32-x86
          path: ${{ env.OPENCPN_TARBALL }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload build tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twocan-windows-build
          path: |
            build/**/*.dll
            build/**/*.lib
            build/**/*.pdb
            build/*.tar.gz
            build/CMakeCache.txt
            build/**/*.log
          if-no-files-found: warn
