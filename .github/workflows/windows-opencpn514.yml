name: Windows OpenCPN 5.14 port

on:
  workflow_dispatch:
  push:
    branches:
      - opencpn-5.14-windows
  pull_request:
    branches:
      - master

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      WX_VERSION: 3.2.6
      WXWIN: ${{ github.workspace }}\cache\wxWidgets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set OpenCPN 5.14 Windows ABI
        shell: pwsh
        run: |
          $path = 'cmake/PluginSetup.cmake'
          $text = Get-Content $path -Raw
          $text = $text.Replace('set(PKG_TARGET "msvc")', 'set(PKG_TARGET "msvc-wx32")')
          $text = $text -replace 'else\(NOT WIN32 AND NOT QT_ANDROID\)\s+set\(ARCH "x86_64"\)', "else(NOT WIN32 AND NOT QT_ANDROID)`n    set(ARCH `"x86`")"
          Set-Content -Path $path -Value $text -Encoding utf8

      - name: Install gettext tools
        shell: pwsh
        run: |
          choco install gettext -y --no-progress
          $gettextBin = 'C:\Program Files\gettext-iconv\bin'
          $env:PATH = "$gettextBin;$env:PATH"
          $gettextBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Get-Command msgfmt
          Get-Command msgmerge

      - name: Download wxWidgets 3.2.6 Win32
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:WXWIN" | Out-Null
          $base = "https://github.com/wxWidgets/wxWidgets/releases/download/v$env:WX_VERSION"
          Invoke-WebRequest "$base/wxWidgets-$env:WX_VERSION-headers.7z" -OutFile wx-headers.7z
          Invoke-WebRequest "$base/wxMSW-$env:WX_VERSION`_vc14x_Dev.7z" -OutFile wx-dev.7z
          Invoke-WebRequest "$base/wxMSW-$env:WX_VERSION`_vc14x_ReleaseDLL.7z" -OutFile wx-dll.7z
          7z x -y wx-headers.7z "-o$env:WXWIN"
          7z x -y wx-dev.7z "-o$env:WXWIN"
          7z x -y wx-dll.7z "-o$env:WXWIN"
          Get-ChildItem "$env:WXWIN\lib"

      - name: Configure VS2022 Win32
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 `
            -DwxWidgets_ROOT_DIR="$env:WXWIN" `
            -DwxWidgets_LIB_DIR="$env:WXWIN\lib\vc14x_dll" `
            -DwxWidgets_CONFIGURATION=mswu `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin DLL
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Build and test CANable V2 SLCAN driver
        shell: pwsh
        run: |
          cmake -S drivers/cantact -B build-cantact -G "Visual Studio 17 2022" -A Win32
          cmake --build build-cantact --config Release --parallel
          ctest --test-dir build-cantact -C Release --output-on-failure

          $driver = Get-ChildItem build-cantact -Recurse -Filter 'cantact.dll' | Select-Object -First 1
          if (-not $driver) { throw 'Modern CANable cantact.dll was not produced' }
          Write-Host "Built modern CANable driver: $($driver.FullName)"

          # Replace the 2019 legacy binary before CPack stages data/drivers.
          Copy-Item $driver.FullName 'data/drivers/cantact.dll' -Force
          "CANTACT_DLL=$($driver.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Inspect DLLs with VS2022 dumpbin
        shell: pwsh
        run: |
          $dll = Get-ChildItem build -Recurse -Filter '*twocan*.dll' | Select-Object -First 1
          if (-not $dll) { throw 'TwoCan DLL was not produced' }
          Write-Host "Built plugin: $($dll.FullName)"

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            Write-Warning "vswhere.exe not found; DLL build succeeded, skipping dumpbin inspection."
            exit 0
          }

          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) {
            Write-Warning "Visual Studio C++ tools not found by vswhere; DLL build succeeded, skipping dumpbin inspection."
            exit 0
          }

          $dumpbin = Get-ChildItem "$vsInstall\VC\Tools\MSVC\*\bin\Hostx64\x86\dumpbin.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) {
            $dumpbin = Get-ChildItem "$vsInstall\VC\Tools\MSVC\*\bin\Hostx86\x86\dumpbin.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if (-not $dumpbin) {
            Write-Warning "dumpbin.exe not found; DLL build succeeded, skipping PE inspection."
            exit 0
          }

          Write-Host "Using dumpbin: $($dumpbin.FullName)"
          & $dumpbin.FullName /headers $dll.FullName | Select-String 'machine'
          & $dumpbin.FullName /dependents $dll.FullName

          Write-Host 'CANable driver architecture and exports:'
          & $dumpbin.FullName /headers $env:CANTACT_DLL | Select-String 'machine'
          $exports = (& $dumpbin.FullName /exports $env:CANTACT_DLL) -join "`n"
          Write-Host $exports
          foreach ($required in @('OpenAdapter','CloseAdapter','ReadAdapter','WriteAdapter','SetAdapterPort','GetAdapterPort')) {
            if ($exports -notmatch "\b$required\b") { throw "cantact.dll missing export $required" }
          }

      - name: Generate and validate OpenCPN msvc-wx32 tarball
        shell: pwsh
        run: |
          Push-Location build
          try {
            cpack -G TGZ -C Release --config CPackConfig.cmake
          }
          finally {
            Pop-Location
          }

          $package = Get-ChildItem build -File -Filter '*.tar.gz' |
            Where-Object { $_.Name -match 'msvc-wx32' -and $_.Name -match 'x86' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $package) { throw 'OpenCPN msvc-wx32 x86 tarball was not produced' }

          Write-Host "OpenCPN package: $($package.FullName)"
          $entries = & tar -tzf $package.FullName
          $entries | ForEach-Object { Write-Host $_ }

          if (-not ($entries | Where-Object { $_ -match '(^|/)plugins[/\\]twocan_plugin_pi\.dll$' })) {
            throw 'Tarball does not contain plugins/twocan_plugin_pi.dll'
          }
          if (-not ($entries | Where-Object { $_ -match '(^|/)plugins[/\\]twocan_plugin_pi/data/drivers/cantact\.dll$' })) {
            throw 'Tarball does not contain the rebuilt CANable cantact.dll'
          }

          $metadataEntry = $entries | Where-Object { $_ -match '(^|/)metadata\.xml$' } | Select-Object -First 1
          if (-not $metadataEntry) { throw 'Tarball does not contain top-level metadata.xml required by OpenCPN 5.14' }

          $metadataText = (& tar -xOzf $package.FullName $metadataEntry) -join "`n"
          Write-Host $metadataText
          if ($metadataText -notmatch '<name>\s*TwoCan Plugin\s*</name>') { throw 'metadata.xml has an unexpected plugin name' }
          if ($metadataText -notmatch '<version>\s*2\.1\.1\.0\s*</version>') { throw 'metadata.xml has an unexpected plugin version' }
          if ($metadataText -notmatch '<api-version>\s*1\.16\s*</api-version>') { throw 'metadata.xml must declare OpenCPN API 1.16' }
          if ($metadataText -notmatch '<target>\s*msvc-wx32\s*</target>') { throw 'metadata.xml must declare target msvc-wx32' }
          if ($metadataText -notmatch '<target-arch>\s*x86\s*</target-arch>') { throw 'metadata.xml must declare target-arch x86' }

          "OPENCPN_TARBALL=$($package.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test import and ABI load on official OpenCPN 5.14
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'opencpn-5.14.0-setup.exe'
          $extractDir = Join-Path $env:RUNNER_TEMP 'opencpn-5.14.0-extracted'
          $setupUrl = 'https://github.com/OpenCPN/OpenCPN/releases/download/Release_5.14.0/opencpn_5.14.0-0%2B4418.91f3b67_setup.exe'
          Invoke-WebRequest $setupUrl -OutFile $setup

          if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
          New-Item -ItemType Directory -Path $extractDir | Out-Null
          & 7z x -y $setup "-o$extractDir"
          if ($LASTEXITCODE -ne 0) { throw "7-Zip could not extract OpenCPN installer (exit $LASTEXITCODE)" }

          $cmd = Get-ChildItem $extractDir -Recurse -Filter 'opencpn-cmd.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cmd) { throw 'Extracted official OpenCPN 5.14 installer did not contain opencpn-cmd.exe' }
          $ocpnDir = $cmd.Directory.FullName

          Push-Location $ocpnDir
          try {
            $abiOutput = & $cmd.FullName print-abi 2>&1
            if ($LASTEXITCODE -ne 0 -or (($abiOutput -join "`n") -notmatch 'msvc-wx32')) {
              throw "Official OpenCPN 5.14 ABI check failed: $($abiOutput -join ' ')"
            }
            $importOutput = & $cmd.FullName -v import-plugin $env:OPENCPN_TARBALL 2>&1
            $importExit = $LASTEXITCODE
            $importOutput | ForEach-Object { Write-Host $_ }
            if ($importExit -ne 0) { throw "OpenCPN 5.14 rejected the tarball; exit $importExit" }
          }
          finally { Pop-Location }

          $pluginDll = Get-ChildItem $env:APPDATA,$env:LOCALAPPDATA -Recurse -Filter 'twocan_plugin_pi.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pluginDll) { throw 'Imported twocan_plugin_pi.dll was not found' }

          $runtime = Join-Path $env:RUNNER_TEMP 'opencpn514-cli-runtime'
          if (Test-Path $runtime) { Remove-Item $runtime -Recurse -Force }
          New-Item -ItemType Directory -Path $runtime | Out-Null
          Copy-Item (Join-Path $ocpnDir '*') $runtime -Recurse -Force
          $shimExe = Join-Path $runtime 'opencpn.exe'
          if (Test-Path $shimExe) { Move-Item $shimExe (Join-Path $runtime 'opencpn-gui.exe') -Force }
          Copy-Item (Join-Path $runtime 'opencpn-cmd.exe') $shimExe -Force

          Push-Location $runtime
          try {
            $loadOutput = & $shimExe -v load-plugin $pluginDll.FullName 2>&1
            $loadExit = $LASTEXITCODE
            $loadOutput | ForEach-Object { Write-Host $_ }
            if ($loadExit -ne 0 -or (($loadOutput -join "`n") -notmatch 'File loaded OK')) {
              throw "TwoCan failed OpenCPN 5.14 ABI load test (exit $loadExit)"
            }
          }
          finally { Pop-Location }

          Write-Host 'PASS: OpenCPN 5.14 accepted the tarball and loaded TwoCan without an ABI loader error.'

      - name: Upload OpenCPN import tarball
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twocan-opencpn514-msvc-wx32-x86
          path: ${{ env.OPENCPN_TARBALL }}
          if-no-files-found: warn
          compression-level: 0

      - name: Upload build tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twocan-windows-build
          path: |
            build/**/*.dll
            build/**/*.lib
            build/**/*.pdb
            build/*.tar.gz
            build/CMakeCache.txt
            build/**/*.log
            build-cantact/**/*.dll
            build-cantact/**/*.lib
            build-cantact/**/*.pdb
            build-cantact/Testing/**
          if-no-files-found: warn
